# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --no-cache-dir torch==2.12.0 torchvision==0.27.0 --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir -r requirements.txt

      - name: Ensure a model checkpoint exists for tests
        # CI runs on a fresh GitHub-hosted checkout with no access to the
        # project's DVC remote (a local folder on the training host), so the
        # real trained models/model.pt is never available here. The API now
        # fails fast when MODEL_PATH is missing (see src/api/main.py), so
        # generate a placeholder (untrained) checkpoint purely to satisfy
        # that startup check. Tests only assert response shape, not
        # accuracy, so random weights are sufficient.
        run: |
          python -c "
          import os
          import torch
          from src.inference.model import SimpleCNN

          os.makedirs('models', exist_ok=True)
          if not os.path.exists('models/model.pt'):
              torch.save(SimpleCNN(num_classes=2).state_dict(), 'models/model.pt')
          "

      - name: Run tests
        run: pytest -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/catsdogs-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/catsdogs-api:${{ github.sha }}

      - name: Build only (verification, non-main)
        if: "!(github.ref == 'refs/heads/main' && github.event_name == 'push')"
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: catsdogs-api:ci-check
