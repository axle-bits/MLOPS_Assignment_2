# .github/workflows/cd.yml
name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: self-hosted
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      # Deploy the exact image CI built for this commit, not a floating :latest.
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the same commit CI tested, so the smoke test and the
          # deployed image come from one revision.
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Pull image built by CI for this commit
        run: docker compose -f deploy/docker-compose.yml pull

      - name: Deploy
        run: docker compose -f deploy/docker-compose.yml up -d

      - name: Install smoke test dependency
        run: pip install --no-cache-dir requests

      - name: Run smoke test
        run: python scripts/smoke_test.py scripts/sample_pet.jpg
